name: CI

# Este flujo es el punto de partida, no el entregable terminado.
# Cada grupo debe completar al menos la etapa de despliegue y justificar
# qué hallazgos bloquean la entrega y cuáles solamente advierten.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Permisos mínimos. El valor por defecto de GitHub es más amplio de lo necesario.
permissions:
  contents: read

env:
  NODE_VERSION: "22.14.0"

jobs:
  calidad:
    name: Pruebas y análisis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas automáticas
        run: npm test

      - name: Auditoría de dependencias
        # No bloquea la entrega todavía: primero hay que ver qué informa.
        # Decidir si pasa a bloqueante es parte del entregable 5.3.
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Buscar secretos en el historial completo
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  imagen:
    name: Construir y escanear la imagen
    runs-on: ubuntu-latest
    needs: calidad
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Los ejecutores de GitHub comparten direcciones IP y el límite de descargas
      # anónimas de Docker Hub es de 10 por hora. Autenticarse con una cuenta
      # gratuita lo sube a 100 y evita fallos intermitentes que parecen magia.
      - name: Iniciar sesión en Docker Hub
        if: ${{ env.DOCKERHUB_USUARIO != '' }}
        env:
          DOCKERHUB_USUARIO: ${{ secrets.DOCKERHUB_USUARIO }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USUARIO }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Iniciar sesión en el registro de GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: turnero:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Escanear la imagen en busca de vulnerabilidades
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: turnero:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0" # cambiar a '1' para que un hallazgo grave frene la entrega
          ignore-unfixed: true

      - name: Normalizar el nombre de la imagen a minúsculas
        id: img
        run: echo "nombre=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Publicar en ghcr.io
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.nombre }}:${{ github.sha }}
            ${{ steps.img.outputs.nombre }}:latest

  # ---------------------------------------------------------------------
  # PENDIENTE (entregable 5.3): agregar acá el despliegue automático.
  #
  # Para PaaS (Render): usar el deploy hook del servicio, guardado como
  #   secreto RENDER_DEPLOY_HOOK, y llamarlo con curl.
  #
  # Para FaaS (Cloudflare): usar cloudflare/wrangler-action@v3 con los
  #   secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
  #
  # En los dos casos: los secretos van en Settings > Secrets and variables,
  # nunca en este archivo ni en ningún otro del repositorio.
  # ---------------------------------------------------------------------
